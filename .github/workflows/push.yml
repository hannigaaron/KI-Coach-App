name: Push Impulse

# Stündlich zur vollen Stunde. Das Skript entscheidet, ob in dieser Stunde
# etwas ansteht. Cron in GitHub läuft in UTC und startet mit fünf bis
# dreissig Minuten Verzug, gelegentlich mehr. Deshalb rechnet das Skript die
# Berliner Zeit selbst aus, statt sich auf die Uhrzeit des Laufs zu verlassen.
# Sommer und Winterzeit sind damit auch erledigt.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      art:
        description: "Welche Nachricht sofort schicken. auto heisst: die dieser Stunde."
        required: false
        type: choice
        default: "auto"
        options: ["auto", "protein", "trinken", "energie", "shake", "stress", "pause"]

# Läuft ein Lauf noch, während der nächste startet, gewinnt der neue. Zwei
# gleichzeitige Läufe würden dieselbe Nachricht doppelt schicken.
concurrency:
  group: push-impulse
  cancel-in-progress: false

jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/push-senden.mjs
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          PUSH_KONTAKT: ${{ secrets.PUSH_KONTAKT }}
          PUSH_ART: ${{ inputs.art }}
